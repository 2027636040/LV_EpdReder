<svg xmlns="http://www.w3.org/2000/svg" width="960" height="676" viewBox="0 0 960 676" role="img" aria-labelledby="title desc">
<title id="title">动态应用包结构</title>
<desc id="desc">应用目录包含清单、文件摘要、程序、独立图标、私有资源及按需加载的私有库。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#778c98"/></marker></defs>
<rect width="960" height="676" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="32" y="40" text-anchor="start" font-size="25" font-weight="600" fill="#20313b"><tspan x="32" dy="0">动态应用包结构</tspan></text>
<rect x="32" y="76" width="896" height="64" rx="10" fill="#edf7f5" stroke="#cad5dc" stroke-width="1.5"/>
<text x="52" y="108" text-anchor="start" font-size="21" font-weight="600" fill="#126c70"><tspan x="52" dy="0">&lt;应用ID&gt;/  完整应用目录</tspan></text>
<path d="M 64 140 V 581" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 64 191 H 112" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="112" y="166" width="816" height="58" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="132" y="201" text-anchor="start" font-size="20" font-weight="600" fill="#20313b"><tspan x="132" dy="0">app.json</tspan></text>
<text x="382" y="201" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="382" dy="0">应用名称、版本、兼容标识及能力声明</tspan></text>
<path d="M 64 269 H 112" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="112" y="244" width="816" height="58" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="132" y="279" text-anchor="start" font-size="20" font-weight="600" fill="#20313b"><tspan x="132" dy="0">files.sha256</tspan></text>
<text x="382" y="279" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="382" dy="0">文件摘要清单</tspan></text>
<path d="M 64 347 H 112" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="112" y="322" width="816" height="58" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="132" y="357" text-anchor="start" font-size="20" font-weight="600" fill="#20313b"><tspan x="132" dy="0">&lt;应用ID&gt;.so</tspan></text>
<text x="382" y="357" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="382" dy="0">应用程序</tspan></text>
<path d="M 64 425 H 112" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="112" y="400" width="816" height="58" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="132" y="435" text-anchor="start" font-size="20" font-weight="600" fill="#20313b"><tspan x="132" dy="0">icon.ezip</tspan></text>
<text x="382" y="435" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="382" dy="0">独立入口图标</tspan></text>
<path d="M 64 503 H 112" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="112" y="478" width="816" height="58" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="132" y="513" text-anchor="start" font-size="20" font-weight="600" fill="#20313b"><tspan x="132" dy="0">res/ 或 assets/</tspan></text>
<text x="382" y="513" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="382" dy="0">应用自己的内容与图像资源</tspan></text>
<path d="M 64 581 H 112" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="112" y="556" width="816" height="58" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="132" y="591" text-anchor="start" font-size="20" font-weight="600" fill="#20313b"><tspan x="132" dy="0">codecs/</tspan></text>
<text x="382" y="591" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="382" dy="0">按需装载的私有库</tspan></text>
</g>
</svg>
