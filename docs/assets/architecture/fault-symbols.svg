<svg xmlns="http://www.w3.org/2000/svg" width="960" height="608" viewBox="0 0 960 608" role="img" aria-labelledby="title desc">
<title id="title">故障现场与调试符号的关联</title>
<desc id="desc">根据发布版本选择固件和模块符号，通过模块装载偏移定位运行地址，再结合寄存器、线程栈及 RAM 转储在 GDB 中分析现场。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#778c98"/></marker></defs>
<rect width="960" height="608" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="32" y="40" text-anchor="start" font-size="25" font-weight="600" fill="#20313b"><tspan x="32" dy="0">故障现场与调试符号的关联</tspan></text>
<path d="M 426 128 H 500" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 426 296 H 500" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 896 128 H 928 V 420 H 480 V 458" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 698 360 V 420" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 284 510 H 320" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="32" y="76" width="394" height="104" rx="10" fill="#edf7f5" stroke="#cad5dc" stroke-width="1.5"/>
<text x="52" y="108" text-anchor="start" font-size="21" font-weight="600" fill="#126c70"><tspan x="52" dy="0">设备运行的发布版本</tspan></text>
<text x="52" y="138" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="52" dy="0">匹配设备运行的固件构建</tspan></text>
<rect x="500" y="76" width="396" height="104" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="520" y="108" text-anchor="start" font-size="21" font-weight="600" fill="#20313b"><tspan x="520" dy="0">main.elf</tspan></text>
<text x="520" y="138" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="520" dy="0">对应构建的完整调试符号</tspan></text>
<rect x="32" y="236" width="394" height="124" rx="10" fill="#edf7f5" stroke="#cad5dc" stroke-width="1.5"/>
<text x="52" y="268" text-anchor="start" font-size="21" font-weight="600" fill="#126c70"><tspan x="52" dy="0">动态模块与装载地址</tspan></text>
<text x="52" y="298" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="52" dy="0">匹配动态模块构建</tspan><tspan x="52" dy="26">确定模块在设备上的运行位置</tspan></text>
<rect x="500" y="236" width="396" height="124" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="520" y="268" text-anchor="start" font-size="21" font-weight="600" fill="#20313b"><tspan x="520" dy="0">.so.nostrip 与地址偏移</tspan></text>
<text x="520" y="298" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="520" dy="0">使用发布时保留的未裁剪符号</tspan><tspan x="520" dy="26">按装载偏移映射到运行地址</tspan></text>
<rect x="32" y="414" width="252" height="142" rx="10" fill="#edf7f5" stroke="#cad5dc" stroke-width="1.5"/>
<text x="52" y="446" text-anchor="start" font-size="20" font-weight="600" fill="#126c70"><tspan x="52" dy="0">故障现场</tspan></text>
<text x="52" y="476" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="52" dy="0">寄存器</tspan><tspan x="52" dy="26">线程栈与 RAM 转储</tspan></text>
<rect x="320" y="458" width="576" height="112" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="340" y="490" text-anchor="start" font-size="21" font-weight="600" fill="#20313b"><tspan x="340" dy="0">GDB 还原运行现场</tspan></text>
<text x="340" y="520" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="340" dy="0">解析函数、源码位置与调用现场</tspan></text>
</g>
</svg>
