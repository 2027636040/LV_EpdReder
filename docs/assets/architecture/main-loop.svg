<svg xmlns="http://www.w3.org/2000/svg" width="960" height="728" viewBox="0 0 960 728" role="img" aria-labelledby="title desc">
<title id="title">主线程中的执行顺序</title>
<desc id="desc">main 主循环依次处理平台事务、LVGL 定时器与刷新，再按最近期限等待并进入下一轮。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#778c98"/></marker></defs>
<rect width="960" height="728" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="32" y="40" text-anchor="start" font-size="25" font-weight="600" fill="#20313b"><tspan x="32" dy="0">主线程中的执行顺序</tspan></text>
<path d="M 455 310 V 356" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 455 522 V 570" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 455 662 V 696 H 900 V 192 H 836" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="32" y="76" width="804" height="234" rx="10" fill="#edf7f5" stroke="#cad5dc" stroke-width="1.5"/>
<text x="52" y="108" text-anchor="start" font-size="21" font-weight="600" fill="#126c70"><tspan x="52" dy="0">ui_app_process()</tspan></text>
<text x="52" y="138" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="52" dy="0">处理插拔卡与存储释放握手</tspan><tspan x="52" dy="26">分发全局输入</tspan><tspan x="52" dy="26">推进受管服务、安装器、应用目录和桌面事务</tspan><tspan x="52" dy="26">执行内置页面导航与设置更新</tspan><tspan x="52" dy="26">到期时采集系统状态快照</tspan></text>
<rect x="32" y="356" width="804" height="166" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="52" y="388" text-anchor="start" font-size="21" font-weight="600" fill="#20313b"><tspan x="52" dy="0">lv_timer_handler()</tspan></text>
<text x="52" y="418" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="52" dy="0">执行 app_fwk 调度定时器与页面 LVGL 定时器</tspan><tspan x="52" dy="26">处理界面布局、绘图任务生成与刷新</tspan></text>
<rect x="32" y="570" width="804" height="92" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="52" y="602" text-anchor="start" font-size="21" font-weight="600" fill="#20313b"><tspan x="52" dy="0">按最近工作期限让出处理器</tspan></text>
<text x="52" y="632" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="52" dy="0">结合 LVGL 返回值及服务下次工作期限</tspan></text>
<text x="858" y="340" text-anchor="start" font-size="17" font-weight="400" fill="#52646f"><tspan x="858" dy="0">下</tspan><tspan x="858" dy="26">一</tspan><tspan x="858" dy="26">轮</tspan></text>
</g>
</svg>
