<svg xmlns="http://www.w3.org/2000/svg" width="960" height="670" viewBox="0 0 960 670" role="img" aria-labelledby="title desc">
<title id="title">统一网络状态与多个使用者</title>
<desc id="desc">网络适配引发 lwIP 状态变化，网络服务采样并发布快照，各订阅者独立处理网络事件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#778c98"/></marker></defs>
<rect width="960" height="670" rx="12" fill="#fff"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="32" y="40" text-anchor="start" font-size="25" font-weight="600" fill="#20313b"><tspan x="32" dy="0">统一网络状态与多个使用者</tspan></text>
<path d="M 480 158 V 202" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 480 294 V 338" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 480 430 V 472 H 180 V 512" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 480 472 V 512" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 480 472 H 780 V 512" fill="none" stroke="#778c98" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="180" y="76" width="600" height="82" rx="10" fill="#edf7f5" stroke="#cad5dc" stroke-width="1.5"/>
<text x="200" y="108" text-anchor="start" font-size="21" font-weight="600" fill="#126c70"><tspan x="200" dy="0">PAN 等网络适配</tspan></text>
<text x="200" y="138" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="200" dy="0">lwIP 网卡状态发生变化</tspan></text>
<rect x="180" y="202" width="600" height="92" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="200" y="234" text-anchor="start" font-size="21" font-weight="600" fill="#20313b"><tspan x="200" dy="0">统一网络服务</tspan></text>
<text x="200" y="264" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="200" dy="0">安排 TCP/IP 线程采样</tspan></text>
<rect x="180" y="338" width="600" height="92" rx="10" fill="#edf7f5" stroke="#cad5dc" stroke-width="1.5"/>
<text x="200" y="370" text-anchor="start" font-size="21" font-weight="600" fill="#126c70"><tspan x="200" dy="0">发布网络快照</tspan></text>
<text x="200" y="400" text-anchor="start" font-size="18" font-weight="400" fill="#52646f"><tspan x="200" dy="0">更新 generation 并通知订阅者</tspan></text>
<rect x="48" y="512" width="264" height="76" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="68" y="544" text-anchor="start" font-size="20" font-weight="600" fill="#20313b"><tspan x="68" dy="0">应用任务</tspan></text>
<rect x="348" y="512" width="264" height="76" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="368" y="544" text-anchor="start" font-size="20" font-weight="600" fill="#20313b"><tspan x="368" dy="0">网络校时</tspan></text>
<rect x="648" y="512" width="264" height="76" rx="10" fill="#f5f8fa" stroke="#cad5dc" stroke-width="1.5"/>
<text x="668" y="544" text-anchor="start" font-size="20" font-weight="600" fill="#20313b"><tspan x="668" dy="0">其他订阅者</tspan></text>
<text x="480" y="634" text-anchor="middle" font-size="19" font-weight="400" fill="#52646f"><tspan x="480" dy="0">各使用者读取快照，独立安排请求或等待</tspan></text>
</g>
</svg>
